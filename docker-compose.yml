services:
  web:
    restart: unless-stopped
    image: quantelle-app:production
    build: .
    command: sh -c "python manage.py migrate && gunicorn stockscores.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env.docker
    volumes:
      - .:/app
    ports:
      # NGINX runs on the host and is the only process that should reach Gunicorn.
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis

  worker:
    restart: unless-stopped
    image: quantelle-app:production
    build: .
    command: celery -A stockscores worker -l info
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  beat:
    restart: unless-stopped
    image: quantelle-app:production
    build: .
    command: celery -A stockscores beat -l info
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  execution_guardian:
    restart: unless-stopped
    image: quantelle-app:production
    build: .
    command: python manage.py execution_guardian --interval 30
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  db:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stockscores
      POSTGRES_PASSWORD: stockscores
      POSTGRES_DB: stockscores
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    image: redis:7-alpine

volumes:
  db_data:
