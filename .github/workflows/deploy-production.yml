name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantelle-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy Quantelle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out production
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rank-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: rank-ui
        run: npm ci

      - name: Test frontend
        working-directory: rank-ui
        run: npm test

      - name: Build frontend
        working-directory: rank-ui
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Test trade lifecycle infrastructure
        working-directory: stockscores
        run: python manage.py test ranker.test_public_sitemap ranker.test_lifecycle_certification ranker.test_trade_lifecycle ranker.test_trade_signals ranker.test_telegram ranker.test_paper_executor ranker.test_execution_guardian_command

      - name: Configure production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$PROD_SSH_KEY" | base64 --decode > ~/.ssh/quantelle_deploy
          chmod 600 ~/.ssh/quantelle_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package and upload tested frontend
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          tar -C rank-ui -czf /tmp/quantelle-rank-ui-dist.tgz dist
          scp -i ~/.ssh/quantelle_deploy /tmp/quantelle-rank-ui-dist.tgz "$PROD_USER@$PROD_HOST:/tmp/quantelle-rank-ui-dist.tgz"

      - name: Deploy production branch
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/quantelle_deploy "$PROD_USER@$PROD_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/alpaca
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing to deploy over a dirty production worktree."
            git status --short
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          values = {}
          for line in Path('.env.docker').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip().strip('"\'')
          ops = values.get('TELEGRAM_OPERATIONS_CHAT_ID', '')
          customer = values.get('TELEGRAM_CHAT_ID', '')
          if not ops or ops == customer:
              raise SystemExit('Configure a distinct staff operations Telegram chat before deploying.')
          if values.get('TELEGRAM_NOTIFICATIONS_ENABLED', '').lower() not in ('true', '1', 'yes'):
              raise SystemExit('Telegram notifications must be enabled for staff incident delivery.')
          if len(values.get('QUANTELLE_RESEARCH_OPERATOR_TOKEN', '')) < 32:
              raise SystemExit('The restricted operator token is not configured.')
          print('Staff alert destination and restricted operator credential configured.')
          PY
          git fetch origin production
          git switch -C production FETCH_HEAD

          frontend_stage="$(mktemp -d /opt/alpaca/rank-ui/.dist-stage.XXXXXX)"
          cleanup_frontend_stage() {
            rm -rf "$frontend_stage"
            rm -f /tmp/quantelle-rank-ui-dist.tgz
          }
          trap cleanup_frontend_stage EXIT
          tar -xzf /tmp/quantelle-rank-ui-dist.tgz -C "$frontend_stage"
          test -f "$frontend_stage/dist/index.html"
          rm -rf /opt/alpaca/rank-ui/dist.previous
          if [ -d /opt/alpaca/rank-ui/dist ]; then
            mv /opt/alpaca/rank-ui/dist /opt/alpaca/rank-ui/dist.previous
          fi
          if ! mv "$frontend_stage/dist" /opt/alpaca/rank-ui/dist; then
            if [ -d /opt/alpaca/rank-ui/dist.previous ]; then
              mv /opt/alpaca/rank-ui/dist.previous /opt/alpaca/rank-ui/dist
            fi
            exit 1
          fi
          rm -rf /opt/alpaca/rank-ui/dist.previous

          docker compose build web
          docker compose run --rm -T web python manage.py migrate --noinput < /dev/null
          docker compose run --rm -T web python manage.py generate_public_sitemap < /dev/null
          docker compose up -d web worker beat execution_guardian
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:8000/api/trade-signals/ > /dev/null
          docker compose exec -T web python manage.py shell -c "from django.conf import settings; job=settings.CELERY_BEAT_SCHEDULE.get('trade-lifecycle-certification-auditor'); assert job and job['schedule'] == 120.0; print(job)" < /dev/null
          docker compose exec -T web python manage.py shell -c "from django.conf import settings; job=settings.CELERY_BEAT_SCHEDULE.get('research-run-heartbeat'); assert job and job['schedule'] == 300.0; print(job)" < /dev/null
          docker compose exec -T web python manage.py shell -c "from django.conf import settings; import requests; r=requests.get('http://127.0.0.1:8000/api/operator/research-runs/', headers={'Authorization': 'Bearer '+settings.QUANTELLE_RESEARCH_OPERATOR_TOKEN}, timeout=10); assert r.status_code == 200, r.status_code; print(r.json()['health'])" < /dev/null
          docker compose exec -T web python manage.py shell -c "from ranker.tasks import run_lifecycle_certification_auditor; print(run_lifecycle_certification_auditor())" < /dev/null
          docker compose exec -T web python manage.py lifecycle_certification_report --limit 5 < /dev/null
          docker compose exec -T web python manage.py shell -c "from ranker.models import TradeSignal; from ranker.lifecycle_audit import audit_trade_signal; open_signals=TradeSignal.objects.filter(status=TradeSignal.STATUS_OPEN, paper_execution_enabled=True); results=[(s.pk, audit_trade_signal(s).checkpoints['broker_held_protection']['result']) for s in open_signals]; print('Open broker protection:', results); assert all(value == 'pass' for _, value in results)" < /dev/null
          REMOTE

      - name: Verify public site
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://quantelle.io/signals > /dev/null
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://quantelle.io/sitemap.xml | grep -q 'http://www.sitemaps.org/schemas/sitemap/0.9'
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://quantelle.io/robots.txt | grep -q 'Sitemap: https://quantelle.io/sitemap.xml'
