name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantelle-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy Quantelle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out production
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rank-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: rank-ui
        run: npm ci

      - name: Test frontend
        working-directory: rank-ui
        run: npm test

      - name: Build frontend
        working-directory: rank-ui
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Test trade lifecycle infrastructure
        working-directory: stockscores
        run: python manage.py test ranker.test_trade_lifecycle ranker.test_telegram ranker.test_paper_executor

      - name: Configure production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$PROD_SSH_KEY" | base64 --decode > ~/.ssh/quantelle_deploy
          chmod 600 ~/.ssh/quantelle_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production branch
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/quantelle_deploy "$PROD_USER@$PROD_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/alpaca
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing to deploy over a dirty production worktree."
            git status --short
            exit 1
          fi
          git fetch origin production
          git switch -C production FETCH_HEAD
          cd rank-ui
          npm ci
          npm run build
          cd /opt/alpaca
          docker compose up -d --build web worker beat
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:8000/api/trade-signals/ > /dev/null
          docker compose exec -T web python manage.py cancel_trade_signal 8 \
            --expected-status published \
            --note "Cancelled before entry. INTC moved beyond the published plan: the Oct. 16 110 call was 15.55 bid / 15.75 ask, above the 7.90 do-not-chase ceiling. No position was opened and no loss was recorded."
          REMOTE

      - name: Verify public site
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://quantelle.io/signals > /dev/null
