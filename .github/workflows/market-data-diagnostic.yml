name: Quantelle market data diagnostic
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      contract:
        description: Exact OCC contract to inspect (read only)
        required: true
        default: QQQ261120P00738000
      preserve_build_backup:
        description: Move the known stale build backup out of the checkout without deleting it
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: quantelle-market-data-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'expo7' &&
       github.event.issue.author_association == 'OWNER' &&
       github.event.issue.title == '[Quantelle Data] Probe')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate contract
        env:
          INPUT_CONTRACT: ${{ inputs.contract }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          if os.environ['GITHUB_EVENT_NAME'] == 'issues':
              payload = json.loads(event['issue']['body'])
              if set(payload) != {'contract'}:
                  raise SystemExit('Only contract is accepted')
              contract = payload['contract']
          else:
              contract = os.environ['INPUT_CONTRACT']
          if not isinstance(contract, str) or not re.fullmatch(r'[A-Z]{1,6}[0-9]{6}[CP][0-9]{8}', contract):
              raise SystemExit('Invalid OCC contract')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CONTRACT=' + contract + '\n')
          PYTHON
          python3 -m py_compile scripts/probe_market_data.py
      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$PROD_SSH_KEY" | base64 --decode > ~/.ssh/quantelle_deploy
          chmod 600 ~/.ssh/quantelle_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -i ~/.ssh/quantelle_deploy "$PROD_USER@$PROD_HOST" 'cd /opt/alpaca && git log -1 --oneline && git status --short && docker compose ps && free -m'
      - name: Preserve known build backup
        if: inputs.preserve_build_backup
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/quantelle_deploy "$PROD_USER@$PROD_HOST" 'bash -se' <<'REMOTE'
          set -eu
          cd /opt/alpaca
          backup=rank-ui/dist.brand-backup-13c50886
          if [ -d "$backup" ] && [ ! -L "$backup" ]; then
            destination="$HOME/quantelle-build-backups/dist.brand-backup-13c50886-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p $HOME/quantelle-build-backups
            mv -- "$backup" "$destination"
            echo "Preserved stale frontend build outside production checkout."
          fi
          git status --short
          REMOTE
      - name: Probe server credentials and feeds (GET only)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -o pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -i ~/.ssh/quantelle_deploy "$PROD_USER@$PROD_HOST" "cd /opt/alpaca && docker compose exec -T web python - '$CONTRACT'" < scripts/probe_market_data.py | tee market-data-diagnostic.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-data-diagnostic
          path: market-data-diagnostic.jsonl
          retention-days: 7
      - name: Report owner-requested data probe
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          result = Path('market-data-diagnostic.jsonl')
          data = result.read_text()[:40000] if result.exists() else 'No data returned; inspect workflow error.'
          Path('/tmp/probe-comment.md').write_text(
              'Read-only market data diagnostic: ' + os.environ['JOB_STATUS'] + '\n' +
              os.environ['RUN_URL'] + '\n\n```json\n' + data + '\n```\n' +
              'Quotes are indicative; inspect timestamps and summary before use. No orders changed.')
          PYTHON
          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/probe-comment.md
          if [ "$JOB_STATUS" = success ]; then gh issue close "$ISSUE" --repo "$REPO"; fi
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/quantelle_deploy
