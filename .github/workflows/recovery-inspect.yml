name: Quantelle recovery inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quantelle-recovery-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$PROD_SSH_KEY" | base64 --decode > ~/.ssh/quantelle_deploy
          chmod 600 ~/.ssh/quantelle_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Inspect memory and current services without changing orders
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -i ~/.ssh/quantelle_deploy "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -u
          date -u
          uptime
          free -m
          df -h /
          ps -eo pid,ppid,comm,rss,pcpu,pmem --sort=-rss | head -25
          cd /opt/alpaca
          git log -1 --oneline
          docker compose ps
          timeout 30 docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.MemPerc}} {{.PIDs}}' || true
          for service in web worker beat execution_guardian; do
            container=$(docker compose ps -q "$service")
            if [ -n "$container" ]; then
              docker exec "$container" sh -c 'ps -eo pid,comm,rss 2>/dev/null || true'
            fi
          done
          docker compose exec -T redis redis-cli INFO memory < /dev/null | grep -E 'used_memory:|used_memory_human:|used_memory_rss_human:|used_memory_peak_human:|maxmemory:|maxmemory_policy:|mem_fragmentation_ratio:'
          for queue in celery customer-paper; do
            printf '%s queue depth: ' "$queue"
            docker compose exec -T redis redis-cli LLEN "$queue" < /dev/null
          done
          docker compose exec -T redis redis-cli INFO keyspace < /dev/null
          docker compose exec -T web python - <<'PY'
          import os, sys, json, inspect
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "stockscores.settings")
          import django
          django.setup()
          from django.conf import settings
          from ranker.alpaca_paper import AlpacaPaperClient
          from ranker.trade_quotes import get_trade_signal_quote
          from ranker.tasks import _process_published_signal
          from ranker.models import TradeExecutorHealth, TradeSignal
          print("Recovery policy:", json.dumps({
              "customer_dispatch_enabled": settings.CUSTOMER_PAPER_DISPATCH_ENABLED,
              "customer_dispatch_scheduled": "customer-paper-dispatch" in settings.CELERY_BEAT_SCHEDULE,
              "publication_alpaca_first": "client.option_quote" in inspect.getsource(get_trade_signal_quote),
              "entry_high_enforced": "min(ceilings)" in inspect.getsource(_process_published_signal),
              "pandas_loaded_at_setup": "pandas" in sys.modules,
              "yfinance_loaded_at_setup": "yfinance" in sys.modules,
          }))
          from ranker.alpaca_paper import load_paper_config
          config = load_paper_config()
          print("Paper config:", {"enabled": config.enabled, "confirm_seconds": config.confirm_seconds, "max_open_positions": config.max_open_positions, "option_feed": config.option_feed})
          print("Executor:", list(TradeExecutorHealth.objects.values("status", "entries_paused", "last_completed_at", "last_success_at", "last_error")))
          print("Active DB signals:", list(TradeSignal.objects.filter(status__in=["published", "open"]).values("id", "symbol", "status", "paper_execution_enabled")))
          client = AlpacaPaperClient()
          clock = client.clock()
          print("Broker read-only:", {"is_open": clock.get("is_open"), "positions": len(client.positions()), "open_orders": len([o for o in client.orders() if o.get("status") in ("new", "accepted", "partially_filled", "pending_new")])})
          PY
          docker compose logs --tail 5 execution_guardian < /dev/null
          docker system df
          sudo -n -l || true
          printf 'Shadow observer process count: '
          pgrep -fc '[m]anage.py shadow_observer' || true
          printf 'HTTP local API: '
          curl -sS --max-time 8 -o /dev/null -w '%{http_code} %{time_total}\n' http://127.0.0.1:8000/api/trade-signals/ || true
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/quantelle_deploy
