<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore Quantelle's options plans and public paper trade record, including entries, risk levels, stops, targets, and completed outcomes." />
    <title>Quantelle | Options Research and Public Paper Trade Record</title>
    <!-- Critical fallback styles: render crawlable content before the JS/CSS bundle arrives.
         Scoped to the static root child; React replaces it with its own app wrapper. -->
    <style id="quantelle-first-paint">
      html, body { margin: 0; background: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #root > main { box-sizing: border-box; min-height: 100vh; max-width: 1152px; margin: 0 auto; padding: 64px 24px; line-height: 1.75; background: radial-gradient(circle at 75% 20%, rgba(79,70,229,.18), transparent 35%); }
      #root > main h1 { max-width: 850px; margin: 0 0 24px; color: #f8fafc; font-size: clamp(2.25rem, 5vw, 3.75rem); line-height: 1.08; letter-spacing: -.035em; font-weight: 700; }
      #root > main h2 { margin: 36px 0 16px; color: #e2e8f0; font-size: 1.5rem; line-height: 1.3; font-weight: 600; }
      #root > main p { max-width: 760px; margin: 16px 0; color: #cbd5e1; font-size: 1.125rem; }
      #root > main a { color: #a5b4fc; text-decoration: underline; text-underline-offset: 4px; }
      #root > main nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
      #root > main nav a { display: inline-block; padding: 10px 18px; border: 1px solid #334155; border-radius: 12px; background: #0f172a; color: #e2e8f0; font-weight: 600; text-decoration: none; }
      #root > main nav a:first-child { background: #4f46e5; border-color: #4f46e5; color: white; }
      #root > main ul { padding-left: 24px; }
      #root > main li { margin: 12px 0; }
      #root > main time { color: #94a3b8; }
      #root > main a:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 4px; }
      @media (max-width: 640px) { #root > main { padding: 48px 16px; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main>
        <h1>Quantelle options research and paper trade record</h1>
        <p>Explore public options trade plans with entries, risk levels, stops, targets, and completed paper trade outcomes.</p>
        <nav aria-label="Public pages">
          <a href="/signals">Live options plans</a>
          <a href="/articles">Research articles</a>
          <a href="/dashboard">Market dashboard</a>
          <a href="/support">Support</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
